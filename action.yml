name: Set up Domain Memory
description: Install the Domain Memory executable of one release, checked against its SHA256SUMS, and put it on PATH.
author: ArthurC02
branding:
  icon: book-open
  color: blue

inputs:
  version:
    description: The release to install, such as v7.0.5, or latest. Defaults to the release of the commit this action is used at, whether pinned by tag or by SHA.
    required: false
    default: ''
  sha256sums:
    description: The SHA-256 the release's SHA256SUMS must have; set it to detect a replaced release asset.
    required: false
    default: ''

outputs:
  path:
    description: The installed executable.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        DOMAIN_MEMORY_VERSION: ${{ inputs.version }}
        DOMAIN_MEMORY_SHA256SUMS_SHA256: ${{ inputs.sha256sums }}
        DOMAIN_MEMORY_INSTALL_DIR: ${{ runner.temp }}/domain-memory
      run: |
        if [ -z "$DOMAIN_MEMORY_VERSION" ]; then
          DOMAIN_MEMORY_VERSION=$(sed -n 's/^ *"version": *"\([^"]*\)".*/v\1/p' "$GITHUB_ACTION_PATH/plugins/domain-memory/.claude-plugin/plugin.json")
          export DOMAIN_MEMORY_VERSION
        fi
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$DOMAIN_MEMORY_INSTALL_DIR" >> "$GITHUB_PATH"
        name=domain-memory
        test "$RUNNER_OS" != Windows || name=domain-memory.exe
        echo "path=$DOMAIN_MEMORY_INSTALL_DIR/$name" >> "$GITHUB_OUTPUT"
