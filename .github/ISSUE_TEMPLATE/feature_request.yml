name: Friction or feature
description: Something cost you a redo, or a task the commands cannot do yet.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What you were trying to do
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What got in the way
      description: The command, the message, or the missing step.
    validations:
      required: true
